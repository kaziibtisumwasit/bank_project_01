{% extends 'base.html' %}

{% block head_title %}
<title>Change Password</title>
{% endblock %}

{% block body %}

<div div class="bg-white px-3 py-4 rounded-xl my-6">

    <h2 class="text-2xl font-bold mb-6 text-center">
        Change Password
    </h2>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.errors %}
                    <div class="text-red-500 text-sm mt-1">
                        {{ field.errors }}
                    </div>
                {% endif %}
            </div>
        {% endfor %}

        <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-4">
            Update Password
        </button>

    </form>

</div>

{% endblock %}
